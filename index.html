<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Random Music Player</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents unwanted scrolling */
        }
        .player-container {
            text-align: center;
            max-width: 100%;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #welcome-img {
            max-width: 100%;
            max-height: 55vh; /* Constrains image height so buttons always fit on screen */
            object-fit: contain;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #welcome-img:active {
            transform: scale(0.98);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .btn {
            background-color: #282828;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1; /* Makes buttons share space evenly */
            max-width: 110px;
        }
        .btn:hover {
            background-color: #3e3e3e;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-next {
            background-color: #1db954; 
            color: black;
        }
        .btn-next:hover {
            background-color: #1ed760;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #b3b3b3;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Tapping the image plays a new random song -->
        <img id="welcome-img" src="welcome.jpg" alt="Welcome" onclick="playRandomSong()">
        
        <div id="status">Tap image or Next to play</div>

        <div class="controls">
            <button class="btn" onclick="pauseSong()">Pause</button>
            <button class="btn" onclick="stopSong()">Stop</button>
            <button class="btn btn-next" onclick="playRandomSong()">Next</button>
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="audio-player"></audio>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const statusText = document.getElementById('status');
        let currentSongNum = null;

        function playRandomSong() {
            let nextSongNum;
            
            // Prevent playing the exact same song twice in a row
            do {
                nextSongNum = Math.floor(Math.random() * 20) + 1;
            } while (nextSongNum === currentSongNum);
            
            currentSongNum = nextSongNum;
            
            // Format number to match 01.mp3 - 20.mp3 format
            const formattedNum = String(currentSongNum).padStart(2, '0');
            
            // Set source and play
            audioPlayer.src = `Music1/${formattedNum}.mp3`;
            audioPlayer.play()
                .then(() => {
                    statusText.textContent = `Playing track ${formattedNum}`;
                })
                .catch(error => {
                    statusText.textContent = "Tap image to enable audio playback";
                    console.log("Playback blocked or interrupted:", error);
                });
        }

        function pauseSong() {
            if (!audioPlayer.src) return;
            
            if (!audioPlayer.paused) {
                audioPlayer.pause();
                statusText.textContent = "Paused";
            } else {
                audioPlayer.play();
                const formattedNum = String(currentSongNum).padStart(2, '0');
                statusText.textContent = `Playing track ${formattedNum}`;
            }
        }

        function stopSong() {
            if (!audioPlayer.src) return;
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            statusText.textContent = "Stopped";
        }

        // Auto-advance feature: Picks a new random song when the current one finishes
        audioPlayer.addEventListener('ended', () => {
            statusText.textContent = "Song ended. Loading next...";
            playRandomSong();
        });
    </script>
</body>
</html>
