<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Music Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
            max-width: 100%;
            max-height: 100%;
        }
        img {
            max-width: 90vw;
            max-height: 90vh;
            cursor: pointer;
            object-fit: contain;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        img:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Clicking the image triggers a new random song -->
        <img src="welcome.jpg" alt="Welcome" onclick="playRandomSong()">
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer"></audio>

    <script>
        // Total number of mp3 files in the Music1 folder
        const totalSongs = 20;
        const audioPlayer = document.getElementById('audioPlayer');

        function playRandomSong() {
            // Generate a random number between 1 and 20
            const randomIndex = Math.floor(Math.random() * totalSongs) + 1;
            
            // Format number to 2 digits (e.g., 1 -> "01", 12 -> "12")
            const fileNumber = String(randomIndex).padStart(2, '0');
            
            // Construct the path relative to the repository root
            const songPath = `Music1/${fileNumber}.mp3`;
            
            // Load and play the new song
            audioPlayer.src = songPath;
            audioPlayer.play().catch(error => {
                console.log("Playback failed or interrupted:", error);
            });
        }
    </script>

</body>
</html>
