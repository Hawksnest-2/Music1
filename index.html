<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Random Music Player</title>
    <!-- Fixed, reliable CDN link for Lucide Icons -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .player-container {
            text-align: center;
            max-width: 100%;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #welcome-img {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #welcome-img:active {
            transform: scale(0.98);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .btn {
            background-color: #282828;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
            max-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Balanced space between icon and text */
        }
        .btn:hover {
            background-color: #3e3e3e;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-next {
            background-color: #1db954; 
            color: black;
        }
        .btn-next:hover {
            background-color: #1ed760;
        }
        /* Ensures icon alignment aligns tightly with the button text label */
        .btn svg {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #b3b3b3;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <img id="welcome-img" src="welcome.jpg" alt="Welcome" onclick="playRandomSong()">
        
        <div id="status">Tap image or Next to play</div>

        <div class="controls">
            <button class="btn" id="btn-pause" onclick="togglePause()">
                <i data-lucide="pause"></i> <span id="pause-text">Pause</span>
            </button>
            <button class="btn" onclick="restartSong()">
                <i data-lucide="rotate-ccw"></i> <span>Restart</span>
            </button>
            <button class="btn btn-next" onclick="playRandomSong()">
                <i data-lucide="skip-forward"></i> <span>Next</span>
            </button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const statusText = document.getElementById('status');
        const btnPause = document.getElementById('btn-pause');
        let currentSongNum = null;

        function playRandomSong() {
            let nextSongNum;
            
            do {
                nextSongNum = Math.floor(Math.random() * 20) + 1;
            } while (nextSongNum === currentSongNum);
            
            currentSongNum = nextSongNum;
            const formattedNum = String(currentSongNum).padStart(2, '0');
            
            audioPlayer.src = `Music1/${formattedNum}.mp3`;
            audioPlayer.play()
                .then(() => {
                    updateStatus(`Playing track ${formattedNum}`, true);
                })
                .catch(error => {
                    updateStatus("Tap image to enable audio playback", false);
                    console.log("Playback blocked:", error);
                });
        }

        function togglePause() {
            if (!audioPlayer.src) return;
            
            if (!audioPlayer.paused) {
                audioPlayer.pause();
                updateStatus("Paused", false);
            } else {
                audioPlayer.play();
                const formattedNum = String(currentSongNum).padStart(2, '0');
                updateStatus(`Playing track ${formattedNum}`, true);
            }
        }

        function restartSong() {
            if (!audioPlayer.src) return;
            audioPlayer.currentTime = 0;
            
            if (audioPlayer.paused) {
                audioPlayer.play()
                    .then(() => {
                        const formattedNum = String(currentSongNum).padStart(2, '0');
                        updateStatus(`Playing track ${formattedNum}`, true);
                    });
            } else {
                const formattedNum = String(currentSongNum).padStart(2, '0');
                updateStatus(`Playing track ${formattedNum}`, true);
            }
        }

        function updateStatus(text, isPlaying) {
            statusText.textContent = text;
            
            if (isPlaying) {
                btnPause.innerHTML = '<i data-lucide="pause"></i> <span id="pause-text">Pause</span>';
            } else {
                btnPause.innerHTML = '<i data-lucide="play"></i> <span id="pause-text">Play</span>';
            }
            // Re-render fresh icons via script setup
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        audioPlayer.addEventListener('ended', () => {
            statusText.textContent = "Song ended. Loading next...";
            playRandomSong();
        });

        // Initial launch icon parser
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
